# Viper chain indexer — the /v1 API, no rendering.
#
# Unlike the renderers this cannot scale to zero: it holds two outbound
# WebSocket subscriptions and a 30s reconciler, so it needs one machine always
# running. That is the single always-on cost in the whole plan.
#
# The log store lives on a small volume. It is still a rebuildable cache — a
# full backfill takes about 8 seconds — but persisting it means a restart
# resumes from its watermark in about a second instead of re-indexing, and the
# service does not depend on an RPC provider answering at boot. The rebuild
# path stays as the fallback if the volume is ever lost.

app            = "folia-viper-indexer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  network         = "homestead"
  INDEXER         = "true"
  INDEXER_SOURCE  = "true"
  INDEXSUPPLY     = "false"
  INDEXER_DB      = "/data/viper-index.json"
  NODE_ENV        = "production"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval     = "30s"
    method       = "GET"
    timeout      = "5s"
    path         = "/healthz"

[[mounts]]
  source      = "viper_index"
  destination = "/data"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
